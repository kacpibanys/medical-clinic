info:
  name: edit patient
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}patients/anna.nowak@example.com"
  body:
    type: json
    data: |-
      {
        "email": "anna.nowak@example.com",
        "password": "Tajne#2026",
        "idCardNo": "ABC123456",
        "firstName": "Anna Maria",
        "lastName": "Nowak",
        "phoneNumber": "600100200",
        "birthday": "1990-05-19"
